<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新建会话</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#9CC8FF}a:hover{color:#C4DEFF}
</style>
</helmet>
<div style="min-height: 960px; background: #08090A; color: #E6E7EA; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; box-sizing: border-box">

  <div role="dialog" aria-label="新建会话" style="width: 100%; max-width: 820px; background: #16181C; border: 1px solid #343944; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #262A31">
      <h1 style="margin: 0; font-size: 16px; font-weight: 700">新建会话</h1>
      <a href="Main.dc.html" aria-label="关闭" style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: #9AA0A9; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">Agent</span>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px">
          <sc-for list="{{agents}}" as="a" hint-placeholder-count="9">
            <button type="button" onClick="{{a.pick}}" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; border: 1px solid {{a.border}}; background: {{a.bg}}; color: #E6E7EA; font: inherit; text-align: left; cursor: pointer">
              <span style="width: 28px; height: 28px; border-radius: 7px; background: {{a.color}}; color: #0B0C0E; font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none">{{a.short}}</span>
              <span style="display: flex; flex-direction: column; min-width: 0">
                <span style="font-size: 13px; font-weight: 600">{{a.name}}</span>
                <span style="font-size: 11px; color: {{a.sc}}; font-family: 'JetBrains Mono', monospace">{{a.cmd}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 14px">
        <label style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">项目</span>
          <select style="height: 38px; border-radius: 8px; border: 1px solid #343944; background: #0E0F11; color: #E6E7EA; font: inherit; font-size: 13px; padding: 0 10px">
            <option>api-server　~/code/api-server</option>
            <option>video-editor　~/code/video-editor</option>
            <option>web-app　~/code/web-app</option>
          </select>
        </label>
        <label style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">基于分支</span>
          <select style="height: 38px; border-radius: 8px; border: 1px solid #343944; background: #0E0F11; color: #E6E7EA; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 0 10px">
            <option>main</option>
            <option>feat/oauth-login</option>
          </select>
        </label>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">隔离方式</span>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px">
          <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
            <button type="button" onClick="{{m.pick}}" style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: #E6E7EA; font: inherit; text-align: left; cursor: pointer">
              <span style="font-size: 13px; font-weight: 600">{{m.title}}</span>
              <span style="font-size: 12px; color: #9AA0A9; line-height: 1.5">{{m.desc}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{showBranch}}" hint-placeholder-val="{{ true }}">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">新分支名</span>
          <input type="text" value="{{branchName}}" aria-label="新分支名" style="height: 38px; border-radius: 8px; border: 1px solid #343944; background: #0E0F11; color: #E6E7EA; font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 0 10px">
          <span style="font-size: 11px; color: #9AA0A9">worktree 位置：~/.agentdeck/wt/api-server/{{slug}}　·　根据任务描述自动生成，可改</span>
        </label>
      </sc-if>

      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">任务</span>
        <textarea rows="3" placeholder="描述要做的事，会作为第一条消息发给 agent…" style="border-radius: 8px; border: 1px solid #343944; background: #0E0F11; color: #E6E7EA; font: inherit; font-size: 13px; padding: 10px; resize: vertical">给登录接口接入 GitHub OAuth，回调后写入 session，别破坏现有的密码登录</textarea>
      </label>

      <div style="display: flex; flex-wrap: wrap; gap: 20px">
        <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">自动存档</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{saves}}" as="s" hint-placeholder-count="3">
              <button type="button" onClick="{{s.pick}}" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 12px; cursor: pointer">{{s.t}}</button>
            </sc-for>
          </div>
        </div>
        <div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: #9AA0A9">打开位置</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{places}}" as="s" hint-placeholder-count="3">
              <button type="button" onClick="{{s.pick}}" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 12px; cursor: pointer">{{s.t}}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid #262A31; background: #121417">
      <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #C5C9D0; flex: 1 1 260px">
        <input type="number" value="1" min="1" max="8" aria-label="同时启动几个" style="width: 52px; height: 30px; border-radius: 6px; border: 1px solid #343944; background: #0E0F11; color: #E6E7EA; font: inherit; padding: 0 8px">
        同时启动几个（同一任务给多个 agent 赛跑，选最好的那个合并）
      </label>
      <a href="Main.dc.html" style="display: flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #343944; color: #E6E7EA; font-size: 13px; text-decoration: none">取消</a>
      <a href="Focus.dc.html" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 8px; background: #5AA9FF; color: #0B0C0E; font-weight: 600; font-size: 13px; text-decoration: none">启动会话 <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75">⌘↵</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { agent: 'cc', mode: 'wt', save: 'write', place: 'grid' }; }
  renderVals() {
    const st = this.state;
    const sel = (on) => ({ border: on ? '#5AA9FF' : '#262A31', bg: on ? 'rgba(90,169,255,0.12)' : '#0E0F11' });
    const list = [
      ['cc', 'Claude Code', 'CC', '#D97757', 'claude', true], ['cx', 'Codex CLI', 'CX', '#8B9CF7', 'codex', true],
      ['gm', 'Gemini CLI', 'GM', '#5AA9FF', 'gemini', true], ['ad', 'Aider', 'AD', '#56C48B', 'aider', true],
      ['oc', 'OpenCode', 'OC', '#C9A3F0', 'opencode', true], ['am', 'Amp', 'AM', '#F2A33A', 'amp', true],
      ['qw', 'Qwen Code', 'QW', '#7DD3C0', 'qwen', true], ['cu', 'Cursor CLI', 'CU', '#B8BCC4', '未安装 · 点击安装', false],
      ['custom', '自定义命令', '+', '#4A505B', '任意 TUI，如 goose', true]
    ];
    const agents = list.map((a) => Object.assign({
      name: a[1], short: a[2], color: a[3], cmd: a[4], sc: a[5] ? '#9AA0A9' : '#F2A33A',
      pick: () => this.setState({ agent: a[0] })
    }, sel(st.agent === a[0])));
    const modes = [
      ['wt', '新 worktree + 新分支（推荐）', '独立目录，多个 agent 改同一个仓库也互不覆盖，做完进合并队列'],
      ['shared', '共享当前目录', '直接改工作区，适合只有一个 agent 的小改动；开启文件软锁提醒'],
      ['ro', '只读分析', '不允许写文件，用来读代码、查问题、出方案']
    ].map((m) => Object.assign({ title: m[1], desc: m[2], pick: () => this.setState({ mode: m[0] }) }, sel(st.mode === m[0])));
    const pill = (key, val, t) => {
      const on = st[key] === val;
      return { t, border: on ? '#5AA9FF' : '#343944', bg: on ? 'rgba(90,169,255,0.16)' : 'transparent', fg: on ? '#C4DEFF' : '#C5C9D0',
        pick: () => this.setState({ [key]: val }) };
    };
    const saves = [pill('save', 'write', '每次写文件后'), pill('save', 'timer', '每 5 分钟'), pill('save', 'off', '关闭')];
    const places = [pill('place', 'grid', '加入网格'), pill('place', 'split', '右侧分屏'), pill('place', 'bg', '后台运行')];
    const prefix = st.agent === 'custom' ? 'custom' : st.agent;
    return {
      agents, modes, saves, places,
      showBranch: st.mode === 'wt',
      branchName: 'agent/' + prefix + '/oauth-login',
      slug: 'oauth-login'
    };
  }
}
</script>
</body>
</html>
