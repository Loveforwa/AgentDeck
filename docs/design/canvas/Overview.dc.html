<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F5}
a{color:#1A1A1A}a:hover{color:#000}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background-color: #F7F7F5; background-image: radial-gradient(#E0E0DC 1px, transparent 1px); background-size: 12px 12px; color: #1A1A1A; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif">

  <div style="position: absolute; left: 72px; top: 24px; right: 72px; display: flex; align-items: center; gap: 20px; font-size: 13px">
    <span style="font-weight: 600">My Board</span>
    <span style="color: #6B6B6B">5 repositories · 9 workspaces · 16 terminals</span>
    <span style="flex: 1"></span>
    <div role="group" aria-label="Filter" style="display: flex; gap: 4px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" style="height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid {{f.border}}; background: {{f.bg}}; font: inherit; font-size: 12px; color: {{f.fg}}; cursor: pointer">{{f.t}}</button>
      </sc-for>
    </div>
  </div>

  <sc-for list="{{frames}}" as="fr" hint-placeholder-count="9">
    <section aria-label="{{fr.name}} {{fr.branch}}" style="position: absolute; left: {{fr.x}}; top: {{fr.y}}; width: {{fr.w}}; box-sizing: border-box; border: 1px solid #DCDCD8; border-radius: 10px; background: rgba(255,255,255,0.6); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; opacity: {{fr.op}}">
      <div style="display: flex; align-items: baseline; gap: 8px; font-size: 12px">
        <span style="font-weight: 600">{{fr.name}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6B6B6B; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{fr.branch}}</span>
      </div>
      <div style="display: flex; gap: 8px">
        <sc-for list="{{fr.cards}}" as="c" hint-placeholder-count="2">
          <button type="button" style="flex: 1 1 0; min-width: 0; height: 104px; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; box-sizing: border-box; background: #FFFFFF; border: 1px solid {{c.border}}; border-radius: 7px; font: inherit; text-align: left; color: #1A1A1A; cursor: pointer">
            <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; width: 100%">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: {{c.dot}}; box-shadow: {{c.ring}}; flex: none"></span>{{c.agent}}
            </span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: {{c.lc}}; flex: 1; overflow: hidden">{{c.last}}</span>
            <span style="font-size: 10px; color: {{c.sc}}">{{c.status}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-for>

  <div style="position: absolute; left: 72px; top: 690px; font-size: 12px; color: #6B6B6B">Not in a workspace</div>
  <div style="position: absolute; left: 72px; top: 714px; display: flex; gap: 8px">
    <sc-for list="{{loose}}" as="c" hint-placeholder-count="2">
      <button type="button" style="width: 150px; height: 104px; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E3E0; border-radius: 7px; font: inherit; text-align: left; color: #1A1A1A">
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500"><span style="width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #6B6B6B"></span>{{c.agent}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.5; color: #6B6B6B; flex: 1">{{c.last}}</span>
        <span style="font-size: 10px; color: #6B6B6B">~ · Idle</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 72px; bottom: 20px; font-size: 12px; color: #6B6B6B">原型说明：缩小时终端只显示最后几行；单击任意一个恢复原来的大小，直接接着聊</div>

  <div aria-label="Minimap" style="position: absolute; right: 24px; bottom: 24px; width: 200px; height: 128px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E3E0; border-radius: 8px; overflow: hidden">
    <sc-for list="{{mini}}" as="m" hint-placeholder-count="9">
      <span style="position: absolute; left: {{m.x}}; top: {{m.y}}; width: {{m.w}}; height: {{m.h}}; background: {{m.bg}}; border-radius: 2px"></span>
    </sc-for>
    <span style="position: absolute; left: 6px; top: 6px; width: 130px; height: 70px; box-sizing: border-box; border: 1.5px solid #1A1A1A; border-radius: 3px"></span>
    <span style="position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #6B6B6B">30%</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const px = (n) => n + 'px';
    const WARN = '#C2410C', ERR = '#B91C1C', INK = '#1A1A1A', MUTED = '#6B6B6B';
    const S = {
      run: { dot: INK, ring: 'none', sc: MUTED, border: '#E3E3E0', lc: MUTED },
      wait: { dot: WARN, ring: 'none', sc: WARN, border: '#E9B48F', lc: INK },
      err: { dot: ERR, ring: 'none', sc: ERR, border: '#E7A3A3', lc: INK },
      done: { dot: '#FFFFFF', ring: 'inset 0 0 0 1.5px #6B6B6B', sc: MUTED, border: '#E3E3E0', lc: MUTED }
    };
    const c = (agent, st, last, status) => Object.assign({ agent, st, last, status }, S[st]);
    const defs = [
      { name: 'api-server', branch: 'feat/oauth', x: 72, y: 80, w: 380, cards: [
        c('claude', 'wait', 'Add state validation too?', 'Needs reply'), c('zsh', 'run', 'GET /callback 200', 'pnpm dev'), c('codex', 'run', 'oauth.ts:44 missing check', 'Reviewing')] },
      { name: 'api-server', branch: 'fix/rate-limit', x: 476, y: 80, w: 250, cards: [
        c('codex', 'wait', 'Run redis-cli FLUSHDB? y / n', 'Needs approval')] },
      { name: 'video-editor', branch: 'feat/timeline', x: 750, y: 80, w: 330, cards: [
        c('gemini', 'run', 'Writing tests…', 'Running · 26m'), c('claude', 'run', 'Edit useDrag.ts', 'Running · 9m')] },
      { name: 'cli-tool', branch: 'feat/plugins', x: 1104, y: 80, w: 264, cards: [
        c('cursor', 'run', 'Compiling 142/210', 'Running · 18m')] },
      { name: 'web-app', branch: 'feat/dark-mode', x: 72, y: 280, w: 380, cards: [
        c('amp', 'done', 'PR #48 opened, CI passed', 'Idle'), c('zsh', 'run', 'vite dev :5173', 'Running')] },
      { name: 'api-server', branch: 'refactor/db-pool', x: 476, y: 280, w: 250, cards: [
        c('aider', 'done', 'a3f9c21 lazy-load db pool', 'Idle · merged into main')] },
      { name: 'video-editor', branch: 'feat/export-gif', x: 750, y: 280, w: 330, cards: [
        c('claude', 'wait', 'ffmpeg or gifski?', 'Needs reply'), c('zsh', 'done', 'ffmpeg -version', 'Idle')] },
      { name: 'cli-tool', branch: 'feat/config-init', x: 1104, y: 280, w: 264, cards: [
        c('opencode', 'run', 'write init.ts', 'Running · 4m')] },
      { name: 'web-app', branch: 'fix/hydration', x: 72, y: 480, w: 250, cards: [
        c('qwen', 'err', "Cannot find '@/lib/theme'", 'Error · exit 1')] }
    ];
    const f = this.state.filter;
    const match = (card) => f === 'all' || card.st === f;
    const frames = defs.map((d) => Object.assign({}, d, {
      x: px(d.x), y: px(d.y), w: px(d.w), op: d.cards.some(match) ? '1' : '0.3'
    }));
    const all = defs.reduce((a, d) => a.concat(d.cards), []);
    const count = (st) => all.filter((x) => x.st === st).length;
    const filters = [['all', 'All'], ['wait', 'Waiting ' + count('wait')], ['run', 'Running ' + count('run')], ['err', 'Error ' + count('err')]].map((x) => ({
      t: x[1], bg: f === x[0] ? INK : '#FFFFFF', fg: f === x[0] ? '#FFFFFF' : INK, border: f === x[0] ? INK : '#E3E3E0',
      pick: () => this.setState({ filter: x[0] })
    }));
    const loose = [{ agent: 'opencode', last: 'Plugin system design?' }, { agent: 'claude', last: 'Explain this regex' }];
    const mini = defs.map((d) => ({
      x: px(Math.round(d.x / 9)), y: px(Math.round(d.y / 9) + 6), w: px(Math.round(d.w / 9)), h: px(18),
      bg: d.cards.some((x) => x.st === 'wait') ? '#F3C9AE' : '#E3E3E0'
    }));
    return { frames, filters, loose, mini };
  }
}
</script>
</body>
</html>
