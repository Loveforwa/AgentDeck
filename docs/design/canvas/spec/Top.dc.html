<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>顶栏零件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: rgba(247,247,245,0.95); border-bottom: 1px solid #E3E3E0; font-family: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 9.5px; color: #1A1A1A; white-space: nowrap">
  <span style="font-weight: 600">My Board</span>
  <span style="color: #6B6B6B">{{sum}}</span>
  <span style="flex: 1"></span>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
    <span style="color: {{it.fg}}; font-weight: {{it.fw}}; border: {{it.bd}}; border-radius: 4px; padding: {{it.pad}}; background: {{it.bg}}">{{it.t}}</span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":300,"height":20}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const items = String(p.r || '2 running|!1 waiting').split('|').map((x) => {
      if (x[0] === '!') return { t: x.slice(1), fg: '#C2410C', fw: '500', bd: '0', pad: '0', bg: 'transparent' };
      if (x[0] === '[') return { t: x.replace(/^\[|\]$/g, ''), fg: '#1A1A1A', fw: '400', bd: '1px solid #D6D6D2', pad: '1px 6px', bg: '#FFFFFF' };
      return { t: x, fg: '#6B6B6B', fw: '400', bd: '0', pad: '0', bg: 'transparent' };
    });
    return { w: (p.w || 300) + 'px', sum: p.sum || '', items };
  }
}
</script>
</body>
</html>
