<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>终端窗口零件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: {{border}}; border-radius: 5px; box-shadow: {{shadow}}; overflow: hidden; font-family: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1A1A1A">
  <div style="display: flex; align-items: center; gap: 5px; height: 19px; padding: 0 6px; border-bottom: 1px solid #EEEEEB; font-size: 9.5px; flex: none; white-space: nowrap">
    <span style="width: {{dw}}; height: {{dh}}; border-radius: {{dr}}; background: {{dbg}}; box-shadow: {{dring}}; flex: none"></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">{{cmd}}</span>
    <span style="color: #6B6B6B; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis">{{lbl}}</span>
    <span style="color: {{sc}}">{{s}}</span>
    <span style="color: #6B6B6B; letter-spacing: 2px">{{hov}}</span>
    <span style="font-weight: 700">{{hovBold}}</span>
  </div>
  <div style="flex: 1; min-height: 0; padding: 5px 7px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; line-height: 1.6; overflow: hidden">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
      <div style="min-height: 14px; white-space: pre; overflow: hidden; text-overflow: ellipsis; color: {{l.c}}; border: {{l.bd}}; border-radius: 4px; padding: {{l.pad}}; margin-top: {{l.mt}}">{{l.pre}}<span style="text-decoration: underline; text-underline-offset: 2px">{{l.link}}</span>{{l.post}}</div>
    </sc-for>
  </div>
  <sc-if value="{{hasExit}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-top: 1px solid #EEEEEB; font-size: 9px; color: #6B6B6B; flex: none; white-space: nowrap">
      <span style="flex: 1; overflow: hidden; text-overflow: ellipsis">{{exit}}</span>
      <sc-for list="{{exitBtns}}" as="b" hint-placeholder-count="2">
        <span style="display: inline-flex; align-items: center; height: 17px; padding: 0 7px; border: 1px solid #D6D6D2; border-radius: 4px; color: #1A1A1A; background: #FFFFFF">{{b.t}}</span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":240,"height":140}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const st = p.st || 'run';
    const f = !!p.f;
    const DOT = {
      run: ['6px', '6px', '50%', '#1A1A1A', 'none'],
      wait: ['6px', '6px', '50%', '#C2410C', 'none'],
      idle: ['6px', '6px', '50%', '#FFFFFF', 'inset 0 0 0 1.2px #6B6B6B'],
      start: ['6px', '6px', '50%', '#FFFFFF', 'inset 0 0 0 1.2px #C4C4BF'],
      exit: ['7px', '1.5px', '0', '#6B6B6B', 'none'],
      err: ['7px', '1.5px', '0', '#6B6B6B', 'none']
    }[st] || ['6px', '6px', '50%', '#1A1A1A', 'none'];
    const raw = p.lines === undefined ? '› Add GitHub OAuth to the login API|~  Write src/auth/oauth.ts|~  Bash  pnpm test' : String(p.lines);
    const lines = raw === '' ? [] : raw.split('|').map((x) => {
      let c = '#1A1A1A', box = false, t = x;
      if (t[0] === '~') { c = '#6B6B6B'; t = t.slice(1); }
      else if (t[0] === '!') { c = '#C2410C'; t = t.slice(1); }
      else if (t[0] === '>') { box = true; t = t.slice(1); }
      const mm = t.match(/^(.*)\[\[(.*)\]\](.*)$/);
      return {
        c, pre: mm ? mm[1] : t, link: mm ? mm[2] : '', post: mm ? mm[3] : '',
        bd: box ? '1px solid #D6D6D2' : '0', pad: box ? '2px 6px' : '0', mt: box ? '4px' : '0'
      };
    });
    let border = '1px solid #E3E3E0', shadow = 'none';
    if (f) { border = '1.5px solid #1A1A1A'; shadow = '0 6px 16px rgba(0,0,0,0.10)'; }
    else if (st === 'wait') border = '1px solid #E9B48F';
    if (p.drag) shadow = '0 14px 30px rgba(0,0,0,0.16)';
    return {
      w: (p.w || 240) + 'px', h: (p.h || 140) + 'px', border, shadow,
      dw: DOT[0], dh: DOT[1], dr: DOT[2], dbg: DOT[3], dring: DOT[4],
      cmd: p.cmd || 'claude', lbl: p.lbl || '', s: p.s === undefined ? 'Running' : p.s,
      sc: st === 'wait' ? '#C2410C' : (st === 'err' ? '#B93E0B' : '#6B6B6B'),
      hov: p.hov || '', hovBold: p.hovBold || '',
      lines,
      hasExit: !!p.exit, exit: p.exit || '',
      exitBtns: (p.exitBtns || '').split('|').filter((x) => x).map((t) => ({ t }))
    };
  }
}
</script>
</body>
</html>
