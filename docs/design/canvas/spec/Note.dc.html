<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>提示与通知零件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="display: inline-block; font-family: 'IBM Plex Sans', 'Noto Sans SC', 'PingFang SC', sans-serif; color: #1A1A1A">
  <sc-if value="{{isToast}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; gap: 10px; align-items: center; padding: 7px 10px; background: #1A1A1A; color: #FFFFFF; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.16); font-size: 9.5px; white-space: nowrap">{{text}}<span style="font-weight: 600; text-decoration: underline; text-underline-offset: 2px">{{act}}</span></div>
  </sc-if>
  <sc-if value="{{isPop}}" hint-placeholder-val="{{ false }}">
    <div style="width: {{w}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 8px 9px; background: #FFFFFF; border: 1px solid #E3E3E0; border-radius: 7px; box-shadow: 0 10px 24px rgba(0,0,0,0.12); font-size: 9.5px; line-height: 1.5">
      <span>{{text}}</span>
      <div style="display: flex; justify-content: flex-end; gap: 5px">
        <sc-for list="{{btns}}" as="b" hint-placeholder-count="2">
          <span style="display: inline-flex; align-items: center; height: 17px; padding: 0 7px; border: 1px solid {{b.bd}}; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; font-size: 9px">{{b.t}}</span>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{isNotif}}" hint-placeholder-val="{{ false }}">
    <div style="width: {{w}}; box-sizing: border-box; padding: 8px 10px; background: #FFFFFF; border: 1px solid #E3E3E0; border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,0.12); font-size: 9.5px; line-height: 1.5">
      <span style="display: block; font-size: 10px; font-weight: 600">{{title}}</span>{{text}}
    </div>
  </sc-if>
  <sc-if value="{{isChip}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 6px; padding: 5px 9px; background: #FFFFFF; border: 1px solid #D6D6D2; border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,0.14); font-size: 10px; white-space: nowrap">
      <svg width="13" height="11" viewBox="0 0 13 11" aria-hidden="true"><path d="M1 2.2C1 1.5 1.5 1 2.2 1h2.6l1.2 1.3h4.8c.7 0 1.2.5 1.2 1.2v5.3c0 .7-.5 1.2-1.2 1.2H2.2C1.5 10 1 9.5 1 8.8z" fill="none" stroke="#1A1A1A" stroke-width="1.1"></path></svg>{{text}}
    </div>
  </sc-if>
  <sc-if value="{{isKey}}" hint-placeholder-val="{{ false }}">
    <span style="display: inline-flex; align-items: center; padding: 1px 6px; background: #FFFFFF; border: 1px solid #C9C9C4; border-radius: 4px; box-shadow: 0 1px 0 #C9C9C4; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px">{{text}}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":240,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = p.v || 'toast';
    const btns = String(p.btns || 'Cancel|*OK').split('|').map((x) => {
      const pri = x[0] === '*';
      return { t: pri ? x.slice(1) : x, bg: pri ? '#1A1A1A' : '#FFFFFF', fg: pri ? '#FFFFFF' : '#1A1A1A', bd: pri ? '#1A1A1A' : '#D6D6D2' };
    });
    return {
      isToast: v === 'toast', isPop: v === 'pop', isNotif: v === 'notif', isChip: v === 'chip', isKey: v === 'key',
      text: p.text === undefined ? 'Removed api-server · feat/oauth from the board' : p.text,
      act: p.act || '', title: p.title || '', btns, w: (p.w || 220) + 'px'
    };
  }
}
</script>
</body>
</html>
