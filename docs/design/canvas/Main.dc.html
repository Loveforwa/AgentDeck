<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网格总览</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#9CC8FF}a:hover{color:#C4DEFF}
</style>
</helmet>
<div style="min-height: 1010px; background: #0E0F11; color: #E6E7EA; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #262A31; background: #121417">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; border-radius: 7px; background: #5AA9FF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 5px; box-sizing: border-box">
        <span style="background: #0E0F11; border-radius: 2px"></span><span style="background: #0E0F11; border-radius: 2px"></span><span style="background: #0E0F11; border-radius: 2px"></span><span style="background: #0E0F11; border-radius: 2px; opacity: 0.4"></span>
      </div>
      <span style="font-weight: 700; font-size: 16px; letter-spacing: -0.01em">AgentDeck</span>
    </div>
    <label style="flex: 1 1 260px; max-width: 520px; display: flex; align-items: center; gap: 8px; background: #1C1F24; border: 1px solid #262A31; border-radius: 8px; padding: 0 12px; height: 36px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0A9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" placeholder="搜索会话、分支、文件、提示词…" aria-label="搜索" style="flex: 1; background: transparent; border: 0; outline: none; color: #E6E7EA; font: inherit; font-size: 13px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA0A9; border: 1px solid #343944; border-radius: 4px; padding: 1px 5px">⌘K</span>
    </label>
    <div style="flex: 1 1 auto; display: flex; justify-content: flex-end; align-items: center; gap: 10px; flex-wrap: wrap">
      <nav aria-label="视图切换" style="display: flex; background: #1C1F24; border: 1px solid #262A31; border-radius: 8px; padding: 3px">
        <a href="Main.dc.html" style="padding: 6px 12px; border-radius: 6px; background: #2A2F37; color: #E6E7EA; font-size: 13px; text-decoration: none">网格</a>
        <a href="Focus.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">聚焦</a>
        <a href="Board.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">看板</a>
        <a href="Merge.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">合并台</a>
      </nav>
      <a href="Launch.dc.html" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px; background: #5AA9FF; color: #0B0C0E; font-weight: 600; font-size: 13px; text-decoration: none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>新建会话
      </a>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1">

    <aside style="flex: 1 1 220px; max-width: 280px; border-right: 1px solid #262A31; padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; background: #101215">
      <section style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #9AA0A9; padding: 0 8px 6px">项目 / 分支</div>
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px">
            <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; font-weight: 600">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA0A9" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
              <span style="flex: 1">{{p.name}}</span>
              <span style="font-size: 11px; color: #9AA0A9">{{p.count}}</span>
            </div>
            <sc-for list="{{p.branches}}" as="b" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 30px; font-size: 12px; color: #C5C9D0; font-family: 'JetBrains Mono', monospace">
                <span style="width: 7px; height: 7px; border-radius: 50%; background: {{b.dot}}; flex: none"></span>
                <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.name}}</span>
                <span style="font-size: 10px; color: #9AA0A9">{{b.agent}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </section>
      <section style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #9AA0A9; padding: 0 8px 4px">已接入的 Agent</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px">
          <sc-for list="{{agents}}" as="a" hint-placeholder-count="8">
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #C5C9D0; background: #1C1F24; border: 1px solid #262A31; border-radius: 999px; padding: 3px 8px 3px 3px">
              <span style="width: 16px; height: 16px; border-radius: 50%; background: {{a.color}}; color: #0B0C0E; font-size: 8px; font-weight: 700; display: grid; place-items: center">{{a.short}}</span>{{a.name}}
            </span>
          </sc-for>
        </div>
        <a href="Launch.dc.html" style="font-size: 12px; padding: 4px 8px; text-decoration: none">+ 接入任意 TUI 命令</a>
      </section>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
        <div role="tablist" aria-label="按状态筛选" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
            <button type="button" role="tab" onClick="{{t.pick}}" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: #E6E7EA; font: inherit; font-size: 13px; cursor: pointer">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}}"></span>{{t.label}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA0A9">{{t.count}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9AA0A9">
          <span>分组</span>
          <button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #262A31; background: #16181C; color: #E6E7EA; font: inherit; font-size: 12px">按项目</button>
          <span>列数</span>
          <button type="button" style="height: 30px; padding: 0 10px; border-radius: 6px; border: 1px solid #262A31; background: #16181C; color: #E6E7EA; font: inherit; font-size: 12px">自动</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px">
        <sc-for list="{{tiles}}" as="s" hint-placeholder-count="9">
          <a href="Focus.dc.html" style="display: flex; flex-direction: column; height: 270px; background: #16181C; border: 1px solid {{s.border}}; border-radius: 10px; overflow: hidden; text-decoration: none; color: #E6E7EA">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px">
              <span style="width: 24px; height: 24px; border-radius: 6px; background: {{s.color}}; color: #0B0C0E; font-size: 10px; font-weight: 700; display: grid; place-items: center; flex: none">{{s.short}}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                <span style="font-size: 13px; font-weight: 600">{{s.agent}} <span style="color: #9AA0A9; font-weight: 400">· {{s.project}}</span></span>
              </div>
              <span style="font-size: 11px; font-weight: 600; color: {{s.fg}}; background: {{s.bg}}; padding: 3px 8px; border-radius: 999px; white-space: nowrap">{{s.label}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; padding: 0 12px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA0A9">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9AA0A9" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="8" r="2"></circle><path d="M6 7v10M18 10c0 4-6 3-12 7"></path></svg>
              <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #C5C9D0">{{s.branch}}</span>
              <span style="color: #56C48B">+{{s.add}}</span><span style="color: #F0686A">−{{s.del}}</span>
            </div>
            <div style="flex: 1; background: #0B0C0E; margin: 0 8px; border-radius: 6px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden">
              <sc-for list="{{s.lines}}" as="l" hint-placeholder-count="5">
                <div style="color: {{l.color}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.t}}</div>
              </sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 11px; color: #9AA0A9">
              <span style="flex: 1">{{s.meta}}</span>
              <span style="font-family: 'JetBrains Mono', monospace">{{s.ckpt}} 个检查点</span>
            </div>
          </a>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1010}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const S = {
      run: { label: '运行中', fg: '#5AA9FF', bg: 'rgba(90,169,255,0.14)' },
      wait: { label: '等待你', fg: '#F2A33A', bg: 'rgba(242,163,58,0.14)' },
      done: { label: '已完成', fg: '#56C48B', bg: 'rgba(86,196,139,0.14)' },
      err: { label: '出错', fg: '#F0686A', bg: 'rgba(240,104,106,0.14)' }
    };
    const C = { p: '#E6E7EA', t: '#9AA0A9', o: '#C5C9D0', ok: '#56C48B', w: '#F2A33A', e: '#F0686A', r: '#5AA9FF' };
    const A = {
      cc: { agent: 'Claude Code', short: 'CC', color: '#D97757' },
      cx: { agent: 'Codex CLI', short: 'CX', color: '#8B9CF7' },
      gm: { agent: 'Gemini CLI', short: 'GM', color: '#5AA9FF' },
      ad: { agent: 'Aider', short: 'AD', color: '#56C48B' },
      oc: { agent: 'OpenCode', short: 'OC', color: '#C9A3F0' },
      am: { agent: 'Amp', short: 'AM', color: '#F2A33A' },
      qw: { agent: 'Qwen Code', short: 'QW', color: '#7DD3C0' },
      cu: { agent: 'Cursor CLI', short: 'CU', color: '#B8BCC4' }
    };
    const raw = [
      ['cc', 'api-server', 'feat/oauth-login', 'run', 142, 38, '运行 12 分 · $0.42', 7, [
        ['p', '> 给登录接口接入 GitHub OAuth'], ['t', '● Read src/auth/session.ts'], ['t', '● Edit src/auth/oauth.ts  (+86)'],
        ['t', '● Bash pnpm test auth'], ['ok', '  ✓ 18 passed  (1.9s)'], ['r', '▍ 正在编写回调路由…']]],
      ['cx', 'api-server', 'fix/rate-limit', 'wait', 23, 9, '已暂停 3 分 · 需要你批准', 3, [
        ['p', '> 修复 /search 接口限流失效'], ['t', '• 修改 middleware/limiter.ts'], ['o', '• 计划执行：redis-cli FLUSHDB'],
        ['w', '? 允许运行这条命令吗？'], ['w', '  [y] 允许   [n] 拒绝   [a] 总是允许']]],
      ['gm', 'video-editor', 'feat/timeline-snap', 'run', 67, 12, '运行 26 分 · 128k tokens', 5, [
        ['p', '> 时间轴拖动时吸附到相邻片段'], ['t', '✦ 阅读 Timeline.tsx, useDrag.ts'], ['t', '✦ 写入 snap.ts'],
        ['o', '  阈值设为 8px，按住 Alt 关闭吸附'], ['r', '▍ 正在补单元测试…']]],
      ['ad', 'api-server', 'refactor/db-pool', 'done', 54, 81, '完成于 10 分钟前', 4, [
        ['p', '> 把数据库连接池改成懒加载'], ['t', 'Applied edit to db/pool.ts'], ['t', 'Applied edit to db/index.ts'],
        ['ok', 'Commit a3f9c21 refactor: 连接池懒加载'], ['ok', '✓ 4 个文件 · 测试全部通过']]],
      ['oc', 'cli-tool', 'feat/config-init', 'run', 31, 2, '运行 4 分 · $0.08', 1, [
        ['p', '> 新增 `tool init` 生成默认配置'], ['t', '→ glob src/commands/**'], ['t', '→ write src/commands/init.ts'],
        ['r', '▍ 思考中…']]],
      ['cc', 'video-editor', 'feat/export-gif', 'wait', 0, 0, '已暂停 8 分 · 等你选方案', 2, [
        ['p', '> 支持导出 GIF'], ['o', '有两种实现方式：'], ['o', '  1) ffmpeg palettegen，零依赖'],
        ['o', '  2) gifski，画质更好但需安装'], ['w', '? 选哪一个？ (1/2)']]],
      ['am', 'web-app', 'feat/dark-mode', 'done', 210, 47, '完成于 1 小时前 · 已开 PR', 9, [
        ['p', '> 全站暗色模式'], ['t', '✓ 22 个组件改用 CSS 变量'], ['t', '✓ 新增 theme.ts 切换逻辑'],
        ['ok', '✓ PR #48 已创建'], ['ok', '✓ CI 通过']]],
      ['qw', 'web-app', 'fix/hydration', 'err', 18, 6, '失败于 2 分钟前', 2, [
        ['p', '> 修复首页 hydration 报错'], ['t', '● 修改 app/layout.tsx'], ['e', '✗ pnpm build 失败'],
        ['e', "  Cannot find module '@/lib/theme'"], ['w', '! 与 feat/dark-mode 改了同一文件 theme.ts']]],
      ['cu', 'cli-tool', 'feat/plugins', 'run', 96, 15, '运行 18 分 · $0.31', 4, [
        ['p', '> 设计插件加载机制'], ['t', '• 读取 6 个文件'], ['t', '• 新建 src/plugin/loader.ts'],
        ['t', '• 运行 cargo test'], ['r', '▍ 编译中 (142/210)…']]]
    ];
    const tiles = raw.map((r) => {
      const st = S[r[3]];
      return Object.assign({}, A[r[0]], st, {
        project: r[1], branch: r[2], status: r[3], add: r[4], del: r[5], meta: r[6], ckpt: r[7],
        border: r[3] === 'wait' ? 'rgba(242,163,58,0.55)' : (r[3] === 'err' ? 'rgba(240,104,106,0.45)' : '#262A31'),
        lines: r[8].map((l) => ({ t: l[1], color: C[l[0]] }))
      });
    });
    const f = this.state.filter;
    const defs = [['all', '全部', '#E6E7EA'], ['run', '运行中', '#5AA9FF'], ['wait', '等待你', '#F2A33A'], ['done', '已完成', '#56C48B'], ['err', '出错', '#F0686A']];
    const tabs = defs.map((d) => ({
      label: d[1], dot: d[2],
      count: d[0] === 'all' ? tiles.length : tiles.filter((t) => t.status === d[0]).length,
      bg: f === d[0] ? '#2A2F37' : '#16181C',
      border: f === d[0] ? '#4A505B' : '#262A31',
      pick: () => this.setState({ filter: d[0] })
    }));
    const dot = (s) => S[s].fg;
    const projects = [
      { name: 'api-server', count: 3, branches: [
        { name: 'feat/oauth-login', agent: 'CC', dot: dot('run') },
        { name: 'fix/rate-limit', agent: 'CX', dot: dot('wait') },
        { name: 'refactor/db-pool', agent: 'AD', dot: dot('done') }] },
      { name: 'video-editor', count: 2, branches: [
        { name: 'feat/timeline-snap', agent: 'GM', dot: dot('run') },
        { name: 'feat/export-gif', agent: 'CC', dot: dot('wait') }] },
      { name: 'web-app', count: 2, branches: [
        { name: 'feat/dark-mode', agent: 'AM', dot: dot('done') },
        { name: 'fix/hydration', agent: 'QW', dot: dot('err') }] },
      { name: 'cli-tool', count: 2, branches: [
        { name: 'feat/config-init', agent: 'OC', dot: dot('run') },
        { name: 'feat/plugins', agent: 'CU', dot: dot('run') }] }
    ];
    return {
      tabs,
      tiles: f === 'all' ? tiles : tiles.filter((t) => t.status === f),
      projects,
      agents: Object.keys(A).map((k) => ({ name: A[k].agent, short: A[k].short, color: A[k].color }))
    };
  }
}
</script>
</body>
</html>
