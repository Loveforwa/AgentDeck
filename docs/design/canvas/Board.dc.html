<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>看板视图</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F11}
a{color:#9CC8FF}a:hover{color:#C4DEFF}
</style>
</helmet>
<div style="min-height: 900px; background: #0E0F11; color: #E6E7EA; font-family: Inter, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #262A31; background: #121417">
    <span style="font-weight: 700; font-size: 16px">AgentDeck</span>
    <nav aria-label="视图切换" style="display: flex; background: #1C1F24; border: 1px solid #262A31; border-radius: 8px; padding: 3px">
      <a href="Main.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">网格</a>
      <a href="Focus.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">聚焦</a>
      <a href="Board.dc.html" style="padding: 6px 12px; border-radius: 6px; background: #2A2F37; color: #E6E7EA; font-size: 13px; text-decoration: none">看板</a>
      <a href="Merge.dc.html" style="padding: 6px 12px; border-radius: 6px; color: #9AA0A9; font-size: 13px; text-decoration: none">合并台</a>
    </nav>
    <div style="flex: 1"></div>
    <span style="font-size: 12px; color: #9AA0A9">所有项目 · 12 个会话 · 今日花费 $3.84</span>
    <a href="Launch.dc.html" style="display: flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 8px; background: #5AA9FF; color: #0B0C0E; font-weight: 600; font-size: 13px; text-decoration: none">+ 新建会话</a>
  </header>

  <div style="flex: 1; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-items: start">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="5">
      <section style="background: #121417; border: 1px solid #262A31; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.dot}}"></span>
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; flex: 1">{{c.title}}</h2>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9AA0A9">{{c.count}}</span>
        </div>
        <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
          <a href="Focus.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: #16181C; border: 1px solid {{k.border}}; text-decoration: none; color: #E6E7EA">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 20px; height: 20px; border-radius: 5px; background: {{k.color}}; color: #0B0C0E; font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none">{{k.short}}</span>
              <span style="font-size: 11px; color: #9AA0A9; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{k.project}}</span>
              <span style="font-size: 11px; color: #9AA0A9">{{k.time}}</span>
            </div>
            <div style="font-size: 13px; font-weight: 600; line-height: 1.4">{{k.task}}</div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{k.lc}}; background: #0B0C0E; border-radius: 6px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.last}}</div>
            <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA0A9">
              <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{k.branch}}</span>
              <span style="color: #56C48B">+{{k.add}}</span><span style="color: #F0686A">−{{k.del}}</span>
            </div>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const A = {
      cc: ['CC', '#D97757'], cx: ['CX', '#8B9CF7'], gm: ['GM', '#5AA9FF'], ad: ['AD', '#56C48B'],
      oc: ['OC', '#C9A3F0'], am: ['AM', '#F2A33A'], qw: ['QW', '#7DD3C0'], cu: ['CU', '#B8BCC4']
    };
    const card = (a, project, task, branch, time, last, lc, add, del, border) => ({
      short: A[a][0], color: A[a][1], project, task, branch, time, last, lc: lc || '#C5C9D0', add, del, border: border || '#262A31'
    });
    const cols = [
      { title: '排队中', dot: '#9AA0A9', cards: [
        card('cc', 'web-app', '给设置页加单元测试', 'agent/cc/settings-tests', '待启动', '等待 feat/dark-mode 合并后开始', '#9AA0A9', 0, 0)
      ] },
      { title: '运行中', dot: '#5AA9FF', cards: [
        card('cc', 'api-server', '接入 GitHub OAuth', 'feat/oauth-login', '12 分', '▍ 正在编写回调路由…', '#5AA9FF', 142, 38),
        card('gm', 'video-editor', '时间轴吸附', 'feat/timeline-snap', '26 分', '▍ 正在补单元测试…', '#5AA9FF', 67, 12),
        card('oc', 'cli-tool', '新增 tool init', 'feat/config-init', '4 分', '▍ 思考中…', '#5AA9FF', 31, 2),
        card('cu', 'cli-tool', '插件加载机制', 'feat/plugins', '18 分', '▍ 编译中 (142/210)…', '#5AA9FF', 96, 15)
      ] },
      { title: '等待你', dot: '#F2A33A', cards: [
        card('cx', 'api-server', '修复 /search 限流', 'fix/rate-limit', '3 分', '? 允许运行 redis-cli FLUSHDB？', '#F2A33A', 23, 9, 'rgba(242,163,58,0.55)'),
        card('cc', 'video-editor', '支持导出 GIF', 'feat/export-gif', '8 分', '? 选哪个方案？ (1/2)', '#F2A33A', 0, 0, 'rgba(242,163,58,0.55)'),
        card('qw', 'web-app', '修复 hydration 报错', 'fix/hydration', '2 分', "✗ Cannot find module '@/lib/theme'", '#F0686A', 18, 6, 'rgba(240,104,106,0.45)')
      ] },
      { title: '待审查', dot: '#C9A3F0', cards: [
        card('am', 'web-app', '全站暗色模式', 'feat/dark-mode', '1 小时前', '✓ PR #48 · CI 通过', '#56C48B', 210, 47),
        card('ad', 'cli-tool', '整理错误码', 'refactor/errors', '2 小时前', '✓ 3 个 commit · 等你看 diff', '#56C48B', 88, 120)
      ] },
      { title: '已合并', dot: '#56C48B', cards: [
        card('ad', 'api-server', '连接池懒加载', 'refactor/db-pool', '10 分钟前', '◆ 已合入 main · a3f9c21', '#56C48B', 54, 81),
        card('cx', 'video-editor', '修复音画不同步', 'fix/av-sync', '昨天', '◆ 已合入 main · 71be0d4', '#56C48B', 12, 5)
      ] }
    ].map((c) => Object.assign(c, { count: c.cards.length }));
    return { cols };
  }
}
</script>
</body>
</html>
