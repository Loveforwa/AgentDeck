<!doctype html>
<html>
<head><meta charset="utf-8"><title>HistoryPanel — preview</title></head>
<body style="margin:0">
<div class="ds-stage"><div class="ad-panel" style="margin:0;width:300px;height:430px"><div class="ad-panel-body"><nav class="hist" aria-label="History">
<div class="hist-top"><h2 class="hist-title">HISTORY</h2><span class="hist-spacer"></span><button type="button" class="ad-panel-toggle" aria-label="Collapse history"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4 8 8l4 4M4 3v10"/></svg></button></div>
<div class="hist-tools"><input class="hist-search" placeholder="Search sessions" aria-label="Search sessions"></div>
<div class="hist-body">
<section class="hist-project"><h3 class="hist-project-name">agenduck <span class="hist-muted hist-mono" style="font-weight:400">~/2026/agenduck</span></h3>
<button type="button" class="hist-path-row"><span class="hist-caret">▾</span><span class="hist-path-label hist-mono">main</span><span class="hist-muted">main folder</span><span class="hist-spacer"></span><span class="hist-count">23</span></button>
<div class="hist-agent-name" data-agent="claude"><span class="hist-agent-mark" aria-hidden="true"></span>CLAUDE · 14</div>
<ul class="hist-rows">
<li class="hist-row" style="background:var(--hover)"><button type="button" class="hist-row-main"><span class="hist-lamp hist-lamp--running"></span><span class="hist-row-title">Weather comparison Beijing</span><span class="hist-time">now</span></button></li>
<li class="hist-row"><button type="button" class="hist-row-main"><span class="hist-lamp-space"></span><span class="hist-row-title">Three parallel weather subagents</span><span class="hist-time">2h</span></button><span class="hist-row-hover" style="display:flex"><button type="button" class="hist-btn">Resume</button><button type="button" class="hist-btn" aria-label="More">⋯</button></span></li>
<li class="hist-row"><button type="button" class="hist-row-main"><span class="hist-lamp-space"></span><span class="hist-row-title">Fix the login bug</span><span class="hist-time">3d</span></button></li>
</ul>
<button type="button" class="hist-more">Show 10 more</button>
<div class="hist-agent-name" data-agent="codex"><span class="hist-agent-mark" aria-hidden="true"></span>CODEX · 6</div>
<ul class="hist-rows"><li class="hist-row"><button type="button" class="hist-row-main"><span class="hist-lamp hist-lamp--waiting"></span><span class="hist-row-title">Review the OAuth flow</span><span class="hist-time">5m</span></button></li></ul>
<div class="hist-agent-name" data-agent="pi"><span class="hist-agent-mark" aria-hidden="true"></span>PI · 2</div>
<div class="hist-agent-name" data-agent="omp"><span class="hist-agent-mark" aria-hidden="true"></span>OMP · 3</div>
<div class="hist-agent-name" data-agent="kimi"><span class="hist-agent-mark" aria-hidden="true"></span>KIMI · 1</div>
<button type="button" class="hist-path-row"><span class="hist-caret">▸</span><span class="hist-path-label hist-mono">feat/N11-session-history</span><span class="hist-spacer"></span><span class="hist-count">4</span></button>
</section>
</div></nav></div></div></div>
</body>
</html>
