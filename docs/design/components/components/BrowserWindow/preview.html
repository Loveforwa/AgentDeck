<!doctype html>
<html>
<head><meta charset="utf-8"><title>BrowserWindow — preview</title></head>
<body style="margin:0">
<div class="ds-stage">
<div class="ad-window ad-window--focused" style="width:360px;height:200px"><div class="ad-window-titlebar"><span class="ad-window-dot ad-window-dot--empty" aria-hidden="true"></span><span class="ad-window-name">localhost</span><span class="ad-window-label"></span><span class="ad-window-actions"><button type="button" class="ad-window-button" aria-label="Maximize"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M7 2h3v3M5 10H2V7M10 2 6.8 5.2M2 10l3.2-3.2"/></svg></button><button type="button" class="ad-window-button" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9"/></svg></button></span></div><div class="ad-window-content"><div class="ad-browser">
<div class="ad-browser__toolbar"><button type="button" class="ad-button ad-button--ghost ad-button--sm" aria-label="Back"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4 5.5 8l4 4"/></svg></button><button type="button" class="ad-button ad-button--ghost ad-button--sm" aria-label="Forward" disabled><span style="display:inline-flex;transform:scaleX(-1)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4 5.5 8l4 4"/></svg></span></button><button type="button" class="ad-button ad-button--ghost ad-button--sm" aria-label="Reload"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg></button><input class="ad-browser__address" aria-label="Address" value="localhost:3000/login"></div>
<div class="ad-browser__content"><div class="ad-browser__message" role="status"><p class="ad-browser__message-title">localhost:3000 isn’t responding.</p><p class="ad-browser__message-detail">The dev server may not have started yet, or it stopped.</p><div class="ad-browser__message-actions"><button type="button" class="ad-button ad-button--default ad-button--sm">Retry</button></div></div></div>
</div></div></div>
</div>
</body>
</html>
