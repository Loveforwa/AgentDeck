<!-- @dsCard group="Board" height=200 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>BoardChrome — preview</title></head>
<body style="margin:0">
<div class="ds-stage" style="flex-direction:column;align-items:stretch">
<div class="ds-row" style="justify-content:space-between;width:760px">
<span class="ad-board-zoom" style="position:static"><button type="button" class="ad-button ad-button--ghost ad-button--sm">40%</button></span>
<div class="ad-shortcut-hints" style="position:static;opacity:1;flex:1;justify-content:flex-end"><span class="ad-shortcut-hint"><kbd>⌘J ⌘⇧J</kbd> jump to the terminal waiting for you</span><span class="ad-shortcut-hint"><kbd>⌘⇧] ⌘⇧[</kbd> next / previous window by position</span></div>
</div>
<div class="ad-board-empty" style="position:static;height:90px"><p>Add a project to get started, or right-click to open a terminal.</p><div class="ad-board-empty-actions"><button type="button" class="ad-button ad-button--primary ad-button--md">Add project</button><button type="button" class="ad-button ad-button--default ad-button--md">New terminal</button></div></div>
</div>
</body>
</html>
