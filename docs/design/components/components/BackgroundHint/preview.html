<!doctype html>
<html>
<head><meta charset="utf-8"><title>BackgroundHint — preview</title></head>
<body style="margin:0">
<div class="ds-stage" style="flex-direction:column;gap:30px">
<div class="ad-window-node" style="width:380px;height:70px"><div class="ad-window " style="width:380px;height:70px"><div class="ad-window-titlebar"><span class="ad-window-dot ad-window-dot--filled ad-window-dot--running" aria-hidden="true"></span><span class="ad-window-name">claude</span><span class="ad-window-label"></span><span class="ad-window-status ad-window-status--running">Running · 1m</span></div><div class="ad-window-content"><div class="ad-terminal"><div class="ad-terminal__summary"><div class="ad-terminal__summary-line">● Three agents launched in parallel</div></div></div></div></div><button type="button" class="ad-plugin-mark ad-auto-approve-mark">Auto-approve</button><button type="button" class="ad-bg-hint" data-tone="running" aria-expanded="false"><span class="ad-bg-lamp ad-bg-lamp--running"></span>5 background agents · 3 running</button></div>
<div class="ds-row" style="gap:28px">
<div class="ad-window-node" style="width:260px;height:44px"><div class="ad-window " style="width:260px;height:44px"><div class="ad-window-titlebar"><span class="ad-window-dot ad-window-dot--hollow ad-window-dot--muted" aria-hidden="true"></span><span class="ad-window-name">claude</span><span class="ad-window-label"></span><span class="ad-window-status ad-window-status--muted">Idle</span></div><div class="ad-window-content"></div></div><button type="button" class="ad-bg-hint" data-tone="error" aria-expanded="true"><span class="ad-bg-lamp ad-bg-lamp--failed"></span>5 background agents · 1 failed</button></div>
<div class="ad-window-node" style="width:260px;height:44px"><div class="ad-window " style="width:260px;height:44px"><div class="ad-window-titlebar"><span class="ad-window-dot ad-window-dot--hollow ad-window-dot--muted" aria-hidden="true"></span><span class="ad-window-name">claude</span><span class="ad-window-label"></span><span class="ad-window-status ad-window-status--muted">Idle</span></div><div class="ad-window-content"></div></div><button type="button" class="ad-bg-hint" data-tone="done">✓ 5 done</button></div>
</div></div>
</body>
</html>
