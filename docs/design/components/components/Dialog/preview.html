<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dialog — preview</title></head>
<body style="margin:0">
<div class="ds-stage">
<div class="ad-dialog" style="width:380px" role="dialog" aria-label="Delete workspace">
<h2 class="ad-dialog-title">Delete workspace api-server · feat/oauth</h2>
<div class="ad-dialog-body">
<p class="ad-dialog-text ad-dialog-text--muted">claude and zsh will be stopped</p>
<div class="ad-radio-group" role="radiogroup">
<label class="ad-radio"><input class="ad-radio-input" type="radio" name="d1"><span class="ad-radio-dot" aria-hidden="true"></span><span class="ad-radio-text"><span class="ad-radio-label">Remove from board</span><span class="ad-radio-description">Keeps the folder and branch</span></span></label>
<label class="ad-radio"><input class="ad-radio-input" type="radio" name="d1" checked><span class="ad-radio-dot" aria-hidden="true"></span><span class="ad-radio-text"><span class="ad-radio-label">Also delete the worktree folder</span><span class="ad-radio-description">The branch is kept</span></span></label>
</div>
<p class="ad-dialog-text ad-dialog-text--attention">Uncommitted changes in this worktree will be lost</p>
<label class="ad-checkbox"><input type="checkbox">I understand these changes will be lost</label>
</div>
<div class="ad-dialog-actions"><button type="button" class="ad-button ad-button--default ad-button--md">Cancel</button><button type="button" class="ad-button ad-button--primary ad-button--md">Delete</button></div>
</div>
</div>
</body>
</html>
