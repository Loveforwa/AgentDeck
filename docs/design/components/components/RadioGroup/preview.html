<!doctype html>
<html>
<head><meta charset="utf-8"><title>RadioGroup — preview</title></head>
<body style="margin:0">
<div class="ds-stage">
<div class="ad-radio-group" role="radiogroup" aria-label="Folder" style="width:320px">
<label class="ad-radio"><input class="ad-radio-input" type="radio" name="r" checked><span class="ad-radio-dot" aria-hidden="true"></span><span class="ad-radio-text"><span class="ad-radio-label">New worktree</span></span></label>
<label class="ad-radio" data-disabled><input class="ad-radio-input" type="radio" name="r" disabled><span class="ad-radio-dot" aria-hidden="true"></span><span class="ad-radio-text"><span class="ad-radio-label">Main folder</span><span class="ad-radio-description">Already on board</span></span></label>
</div>
</div>
</body>
</html>
