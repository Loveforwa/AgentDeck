<!doctype html>
<html>
<head><meta charset="utf-8"><title>Popover — preview</title></head>
<body style="margin:0">
<div class="ds-stage">
<div class="ad-popover-panel ad-popover--chrome"><div class="scm-branch-popover" style="font-size:var(--text-sm)">
<input class="scm-input" placeholder="Search branches" aria-label="Search branches">
<div class="scm-branch-list" role="listbox">
<div class="scm-branch-option" data-active><span class="scm-branch-check"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"/></svg></span><span class="scm-branch-name">feat/login</span></div>
<div class="scm-branch-option"><span class="scm-branch-check"></span><span class="scm-branch-name">main</span></div>
<div class="scm-branch-option" data-occupied><span class="scm-branch-check"></span><span class="scm-branch-name">feat/oauth</span><span class="scm-branch-option-note">in api-server</span></div>
<div class="scm-separator"></div>
<div class="scm-branch-option"><span class="scm-branch-check"></span><span class="scm-branch-name scm-branch-name--action">New branch…</span></div>
</div></div></div>
</div>
</body>
</html>
