<!-- @dsCard group="Panels" height=360 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SettingsDialog — preview</title></head>
<body style="margin:0">
<div class="ds-stage"><div class="ad-dialog" style="width:620px"><h2 class="ad-dialog-title">Settings</h2><div class="ad-dialog-body">
<div class="ad-settings" style="min-height:200px">
<nav class="ad-settings-nav"><div class="ad-settings-nav-heading">Projects</div><button type="button" class="ad-settings-nav-item" aria-current="page"><span class="ad-settings-nav-label">agenduck</span><span class="ad-settings-nav-hint">2</span></button><button type="button" class="ad-settings-nav-item"><span class="ad-settings-nav-label">repo</span></button><div class="ad-settings-nav-rule"></div><button type="button" class="ad-settings-nav-item"><span class="ad-settings-nav-label">General</span></button></nav>
<div class="ad-settings-page">
<div class="ad-field"><span class="ad-field-label">Folder</span><span class="ad-field-control"><span class="ad-settings-path">~/2026/agenduck</span></span></div>
<div class="ad-field"><span class="ad-field-label">Base branch</span><span class="ad-field-control"><button type="button" class="ad-button ad-button--default ad-button--md ad-select"><span class="ad-select-value">main</span></button></span></div>
<div class="ad-field"><span class="ad-field-label">Files to copy</span><span class="ad-field-control"><textarea class="ad-input ad-textarea" rows="2">.env.local</textarea><span class="ad-settings-hint">One per line, copied from the project folder into each new worktree</span></span></div>
<div class="ad-field"><span class="ad-field-label">Setup command</span><span class="ad-field-control"><input class="ad-input" value="pnpm install"><span class="ad-settings-hint">Runs in a Shell inside each new worktree</span></span></div>
</div></div></div>
<div class="ad-dialog-actions"><button type="button" class="ad-button ad-button--ghost ad-button--md ad-settings-file">Open settings.json</button><button type="button" class="ad-button ad-button--default ad-button--md">Cancel</button><button type="button" class="ad-button ad-button--primary ad-button--md">Save</button></div></div></div>
</body>
</html>
