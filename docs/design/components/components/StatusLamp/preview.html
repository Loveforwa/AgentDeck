<!-- @dsCard group="Window" height=230 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusLamp — preview</title></head>
<body style="margin:0">
<div class="ds-stage"><div class="ds-col" style="gap:6px">
<div class="ds-lamp-row"><span class="ad-window-dot ad-window-dot--filled ad-window-dot--running"></span><span class="ad-window-status ad-window-status--running">Running · 4m</span><span class="ds-cap">running</span></div>
<div class="ds-lamp-row"><span class="ad-window-dot ad-window-dot--filled ad-window-dot--attention"></span><span class="ad-window-status ad-window-status--attention" title="Needs approval">Waiting · 2m</span><span class="ds-cap">waiting · hover: Needs approval</span></div>
<div class="ds-lamp-row"><span class="ad-window-dot ad-window-dot--filled ad-window-dot--error"></span><span class="ad-window-status ad-window-status--error">Error · exit 1</span><span class="ds-cap">error</span></div>
<div class="ds-lamp-row"><span class="ad-window-dot ad-window-dot--hollow ad-window-dot--muted"></span><span class="ad-window-status ad-window-status--muted">Idle · now</span><span class="ds-cap">idle / starting</span></div>
<div class="ds-lamp-row"><span class="ad-window-dot ad-window-dot--none ad-window-dot--muted"></span><span class="ad-window-status ad-window-status--muted">Exited</span><span class="ds-cap">exited</span></div>
</div>
<div class="ds-col" style="gap:8px"><span class="ds-cap">top bar · frame header</span>
<div class="ds-row"><span class="ad-topbar-count ad-topbar-count--running"><span class="ad-topbar-lamp"></span>2 running</span><button type="button" class="ad-topbar-waiting"><span class="ad-topbar-lamp ad-topbar-lamp--waiting"></span>1/2 waiting</button></div>
<div class="ds-row"><span class="ad-frame-count ad-frame-running"><span class="ad-frame-lamp"></span>1 running</span><span class="ad-frame-count ad-frame-waiting"><span class="ad-frame-lamp ad-frame-lamp--waiting"></span>2 waiting</span></div>
</div></div>
</body>
</html>
