<!doctype html>
<html>
<head><meta charset="utf-8"><title>Topbar — preview</title></head>
<body style="margin:0">
<div class="ds-stage" style="padding:0;display:block">
<header class="ad-topbar ad-topbar--traffic-lights" style="pointer-events:auto">
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-icon" aria-label="Hide sidebar" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2" width="11" height="10" rx="1.5"/><line x1="5.5" y1="2" x2="5.5" y2="12"/></svg></button>
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-project"><span class="ad-topbar-project-name">My Board</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2.5 4 5 6.5 7.5 4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="ad-topbar-summary">2 workspaces · 12 windows</span>
<span class="ad-topbar-spacer"></span>
<span class="ad-topbar-count ad-topbar-count--running"><span class="ad-topbar-lamp"></span>1 running</span>
<button type="button" class="ad-topbar-waiting"><span class="ad-topbar-lamp ad-topbar-lamp--waiting"></span>2 waiting</button>
<button type="button" class="ad-button ad-button--default ad-button--sm ad-topbar-approve-all">Approve all…</button>
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-icon" aria-label="Settings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M6.9 1.5h2.2l.35 1.75 1.2.5 1.5-1 1.55 1.55-1 1.5.5 1.2 1.75.35v2.2l-1.75.35-.5 1.2 1 1.5-1.55 1.55-1.5-1-1.2.5-.35 1.75H6.9l-.35-1.75-1.2-.5-1.5 1-1.55-1.55 1-1.5-.5-1.2L1.5 9.1V6.9l1.75-.35.5-1.2-1-1.5L4.3 2.3l1.5 1 1.2-.5z"/></svg></button>
</header>
<header class="ad-topbar ad-topbar--traffic-lights" style="pointer-events:auto">
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-icon" aria-label="Show sidebar" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2" width="11" height="10" rx="1.5"/><line x1="5.5" y1="2" x2="5.5" y2="12"/></svg></button>
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-project"><span class="ad-topbar-project-name">agenduck</span><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2.5 4 5 6.5 7.5 4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="ad-topbar-summary">main · 3 windows</span>
<span class="ad-topbar-spacer"></span>
<button type="button" class="ad-button ad-button--ghost ad-button--sm ad-topbar-icon" aria-label="Settings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2"/><path d="M6.9 1.5h2.2l.35 1.75 1.2.5 1.5-1 1.55 1.55-1 1.5.5 1.2 1.75.35v2.2l-1.75.35-.5 1.2 1 1.5-1.55 1.55-1.5-1-1.2.5-.35 1.75H6.9l-.35-1.75-1.2-.5-1.5 1-1.55-1.55 1-1.5-.5-1.2L1.5 9.1V6.9l1.75-.35.5-1.2-1-1.5L4.3 2.3l1.5 1 1.2-.5z"/></svg></button>
</header>
</div>
</body>
</html>
