# AgentDeck 自己的 tmux 配置。
#
# 只给 AgentDeck 的独立实例用：
#   tmux -L agentdeck -f packages/tmux-host/tmux.conf ...
# 用 -L 换了套接字，用 -f 换了配置文件，所以不会读用户的 ~/.tmux.conf，
# 也不会碰用户自己的 tmux 服务。
#
# 目标：tmux 这一层对 agent（claude、codex……）和用户都尽量“透明”：
#   - 不吃任何按键，所有按键原样交给 agent；
#   - 不显示任何 tmux 自己的界面（状态栏、消息、菜单）；
#   - 颜色、粘贴、鼠标、扩展按键和直接在 xterm.js 里跑一样；
#   - tmux 只负责托管进程、保存历史、报告状态。
# 结论和测量数据见同目录的 AGENTS.md。最低 tmux 3.5，实测 3.6a（见 AGENTS.md）。

# ---------------------------------------------------------------------------
# 按键：不要前缀，不要任何默认绑定
# ---------------------------------------------------------------------------

# 关掉前缀键。默认的 C-b 会被 tmux 吃掉，agent 收不到（readline 里 C-b 是左移一格）。
set -g prefix None
set -g prefix2 None

# 去掉全部默认绑定。prefix 表本来就进不去了，但 root 表里有右键菜单、
# 滚轮切窗口这些，会弹出 tmux 自己的界面；copy-mode-vi 用不到。
# 下面只把鼠标需要的几个绑定加回来。
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi

# 用户在系统终端里 tmux attach 时也没有前缀，退出用关掉终端窗口即可；
# AgentDeck 自己的 detach 是结束 attach 进程，不需要按键。

# ---------------------------------------------------------------------------
# 鼠标和滚动
# ---------------------------------------------------------------------------

# 必须开：tmux 在 mouse off 时不会把鼠标事件交给 agent。
# 开了之后 xterm.js 处于鼠标上报模式，自带的选中文本要按住 Option/Shift，
# 平时的选中由下面的 copy-mode 绑定完成（复制走 OSC 52，见 set-clipboard）。
set -g mouse on

# 左键单击：agent 自己要鼠标就转给它。
bind -n MouseDown1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M }

# 左键拖动：agent 要鼠标就转给它，否则进 copy-mode 选中文本。
bind -n MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M }

# 滚轮：
#   - agent 要鼠标（mouse_any_flag）或已经在 copy-mode：原样转发；
#   - agent 在备用屏（全屏界面，但不要鼠标）：转成方向键，和 xterm.js 直接跑时一样；
#   - 其余情况（claude、codex 都在主屏输出）：进 copy-mode 翻 tmux 的历史。
#     -e 表示滚回最底部时自动退出 copy-mode，用起来就像普通终端的回滚。
#     进 copy-mode 的同时就滚 3 行（tmux 默认第一格只进模式不滚动，手感像“卡了一下”）。
#   tmux 托管时外层 xterm.js 处于备用屏，自己没有回滚内容，回滚只能靠 tmux 的历史。
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send -N 3 Up } { copy-mode -e ; send -N 3 -X scroll-up } }
bind -n WheelDownPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send -N 3 Down } }

# 双击选词、三击选行，复制后退出，和普通终端一样。
bind -n DoubleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel }
bind -n TripleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel }

# copy-mode 只留滚动、选中、复制和退出。用 emacs 表，vi 表上面已经清空。
set -g mode-keys emacs
bind -T copy-mode WheelUpPane send -N 3 -X scroll-up
bind -T copy-mode WheelDownPane send -N 3 -X scroll-down
bind -T copy-mode MouseDown1Pane send -X clear-selection
bind -T copy-mode MouseDrag1Pane send -X begin-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode DoubleClick1Pane send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode TripleClick1Pane send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode PPage send -X page-up
bind -T copy-mode NPage send -X page-down
# 其余鼠标事件什么也不做（select-pane 在单窗格里等于空操作）。
# 必须显式绑上，否则会落到下面的 Any 上，松开鼠标就退出了回滚。
bind -T copy-mode MouseUp1Pane select-pane
bind -T copy-mode MouseDown2Pane select-pane
bind -T copy-mode MouseUp2Pane select-pane
bind -T copy-mode MouseDown3Pane select-pane
bind -T copy-mode MouseUp3Pane select-pane
bind -T copy-mode MouseDrag2Pane select-pane
bind -T copy-mode MouseDrag3Pane select-pane
bind -T copy-mode MouseDragEnd2Pane select-pane
bind -T copy-mode MouseDragEnd3Pane select-pane
# 在回滚里按任何别的键：退出 copy-mode 回到底部。这个键本身会被丢掉，
# 界面层（T2/T3）在 pane_in_mode 时先发 cancel 再发键可以避免，见 AGENTS.md。
bind -T copy-mode Any send -X cancel

# 3.6 才有的选项。放在 %if 里，3.5 读这个文件时不会报错。
%if "#{>=:#{version},3.6}"
# copy-mode 右上角的“[12/345]”位置提示不显示，回滚时看起来和普通终端一样。
set -g copy-mode-position-format ''
# 一个会话只有一个窗格，不要滚动条。
set -g pane-scrollbars off
%endif

# ---------------------------------------------------------------------------
# 终端能力：外层（xterm.js）和内层（agent 看到的 TERM）
# ---------------------------------------------------------------------------

# agent 看到的 TERM。macOS 26 和常见 Linux 发行版都自带 tmux-256color 的 terminfo；
# 老系统没有时由 tmux-host 改成 screen-256color（见 AGENTS.md）。
set -s default-terminal tmux-256color

# 外层终端的能力（真彩色、扩展按键……）不写在这里，由 attach 的客户端用 -T 声明：
#   tmux -L agentdeck -f tmux.conf -u -T RGB,extkeys,hyperlinks,sync,strikethrough,usstyle,overline attach -t =<id>
# 原因：xterm.js、iTerm2、Terminal.app 都报 TERM=xterm-256color。在这里给 xterm* 加 RGB，
# 用户用 Terminal.app（macOS 15 及以前不支持真彩色）attach 时颜色会乱；
# 只给 AgentDeck 自己的客户端加，iTerm2、Ghostty 这类终端 tmux 会通过 XTVERSION 自己认出来。
#   RGB        真彩色（等同旧写法 terminal-overrides ',*:Tc'），不加时 24 位色被降成 256 色（实测 ff6400 → 202）；
#   extkeys    向外层申请扩展按键；
#   hyperlinks OSC 8 链接原样转给外层；
#   sync       同步刷新（DEC 2026），减少重绘闪烁；
#   strikethrough / usstyle / overline 少见的文字样式。
# -u：强制按 UTF-8 处理。从访达启动的 Electron 没有 LANG，不加 -u 时中文和 ▶ ✓ ╭ 都变成“_”。

# agent 进程的环境：告诉它可以用真彩色。从访达启动的 Electron 没有 COLORTERM，
# chalk / crossterm 只看 TERM 会降到 256 色。
set-environment -g COLORTERM truecolor
# Claude Code 看到 $TMUX 就主动降到 256 色（它不知道外层支持真彩色），
# 设了这个变量才保留真彩色。实测不设时 claude 的橙色、灰色都变成调色板里的近似色。
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# 不从 attach 的客户端同步环境变量到会话（默认会同步 SSH_AUTH_SOCK 等），
# 每个会话的环境只由 tmux-host 在 new-session -e 里给定，和谁 attach 无关。
set -g update-environment ''

# 扩展按键（Shift+Enter、Ctrl+Enter 这类普通编码分不出来的组合）：
#   on：程序申请了才用扩展格式发给它。claude 和 codex 启动后都会申请（#{pane_key_mode} 是 Ext 2），
#       收到 Shift+Enter = ESC [ 13 ; 2 u；zsh、less 这种没申请的程序收到普通回车，不会冒出乱码。
#       always 会让没申请的程序也收到 ESC [ 13 ; 2 u（实测 zsh 里就是一串乱码）。
#   csi-u：格式用 CSI u。默认的 xterm 格式（ESC [ 27 ; 2 ; 13 ~）codex 不认，Shift+Enter 被吞掉。
set -s extended-keys on
set -s extended-keys-format csi-u

# 收到 ESC 后不等待。默认 10ms 是为了区分“Esc 键”和“Alt+键 / 转义序列”，
# 对本机 pty 来说转义序列总是一次读到，不需要等。Esc 是 claude 里最常用的“打断”。
set -s escape-time 0

# 焦点进出（CSI I / CSI O）转给 agent。
set -s focus-events on

# 复制：
#   on：copy-mode 里选中的文字通过 OSC 52 写到外层（xterm.js 再写到系统剪贴板），
#       agent 自己发的 OSC 52（例如 claude 的 /copy）也会转出去。
#   external 会丢掉 agent 发的 OSC 52。
set -s set-clipboard on

# agent 自己用 DCS tmux; 透传的序列（例如 OSC 9 / OSC 777 通知、图片）交给外层。
# 只在接上显示时有效；没 attach 的终端收不到，所以“需要你处理”靠 agent 钩子，不靠它。
set -g allow-passthrough on

# 外层窗口标题跟随 agent 设置的标题（OSC 0/2），xterm.js 的 onTitleChange 能拿到。
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-set-title on
# 窗口名不跟着命令变，tmux-host 不用它。
set -g automatic-rename off
set -g allow-rename off

# 普通响铃转给外层（attach 时）；同时会触发 alert-bell 钩子。
set -g bell-action any
set -g monitor-bell on
set -g visual-bell off

# ---------------------------------------------------------------------------
# tmux 自己的界面：全部不显示
# ---------------------------------------------------------------------------

set -g status off
# 消息显示 1ms，等于不显示。注意 0 的意思是“一直显示到按键为止”。
set -g display-time 1
# 活动和静默只记标记、不做任何动作。实测：
#   action 不是 none 且 visual off：每次有输出都给 attach 的客户端发一个 BEL（xterm 会响铃）；
#   action 不是 none 且 visual on：在窗格最后一行盖上“Activity in current window”；
#   action none：alert-activity / alert-silence 钩子都不触发。
# 所以 tmux-host 不靠这两个钩子，见 AGENTS.md「活动和静默」。
set -g visual-activity off
set -g visual-silence off
set -g activity-action none
set -g silence-action none
# 一个会话只有一个窗口一个窗格，不需要边框。
set -g pane-border-status off

# ---------------------------------------------------------------------------
# 会话、历史、退出
# ---------------------------------------------------------------------------

# 历史行数。claude 的输出在主屏，往回翻要靠它（codex 在备用屏，自己管回滚，用不到）。
# 实测内存（tmux 3.6a，服务基线约 3.5 MB）：
#   5 万行 60 列纯 ASCII：+35 MB；5 万行 110 列、带真彩色和制表符：+170 MB（约 3.4 KB/行）。
# claude 的输出正是后一种，6 个 agent 各 5 万行就是 1 GB。取 1 万行：最坏每个窗格约 35 MB。
# 更早的对话在 claude 自己的记录里（ctrl+o、/resume）。
set -g history-limit 10000

# 输出活动和静默（3 秒），给没有钩子的 agent 判断“运行中 / 空闲”。
# 打开后 #{window_activity}（秒）、#{window_activity_flag}、#{window_silence_flag} 可以轮询；
# 两个 flag 是粘的，只在 attach / 选中窗口时清掉。terminal.activity / terminal.silence
# 事件由 tmux-host 根据 pipe-pane 抄送的输出自己计时发出，见 AGENTS.md「活动和静默」。
set -g monitor-activity on
set -g monitor-silence 3

# 同一个会话被 AgentDeck 和系统终端同时 attach 时，窗口大小跟最近有输入的那个客户端走。
# 3.1 以后的默认值，这里写明。aggressive-resize 只影响一个窗口挂在多个会话下的情况，我们不这样用。
set -g window-size latest
set -g aggressive-resize off
# 没有客户端时（new-session -d 没给 -x -y）的大小。
set -g default-size 120x32

# 进程退出后保留窗格，tmux-host 用 #{pane_dead} #{pane_dead_status} 读退出码，
# 并通过 pane-died 钩子发 terminal.exit。窗格底部不显示 tmux 的“Pane is dead”提示，
# 退出状态由 AgentDeck 自己的界面显示。
set -g remain-on-exit on
set -g remain-on-exit-format ''

# 会话由 tmux-host 显式 kill，不自动销毁。最后一个会话没了服务退出（默认）。
set -g destroy-unattached off
set -s exit-unattached off
set -s exit-empty on
set -g detach-on-destroy on

# 窗口、窗格编号从 0 开始，tmux-host 用 =<session>:0.0 定位。
set -g base-index 0
set -g pane-base-index 0
